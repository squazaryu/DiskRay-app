name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Xcode toolchain
        run: |
          test -x "$(xcrun --find swift)"
          test "$(xcodebuild -version | head -1)" = "Xcode 26.5"
          xcodebuild -version
          swift --version
          xcrun --show-sdk-path

      - name: Clean package
        run: swift package clean

      - name: Build debug
        run: swift build

      - name: Build release
        run: swift build -c release

      - name: Run tests
        run: swift test
