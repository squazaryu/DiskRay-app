name: release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Semantic app version without leading v (example: 2.2.1)"
        required: true
        type: string
      build_number:
        description: "Optional build number"
        required: false
        type: string

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        run: |
          test -x "$(xcrun --find swift)"
          xcodebuild -version
          swift --version
          xcrun --show-sdk-path

      - name: Verify source
        run: |
          swift package clean
          swift build
          swift build -c release
          swift test

      - name: Build app bundle
        run: |
          chmod +x scripts/install_app.sh scripts/release.sh scripts/notarize.sh scripts/package_release.sh scripts/ui_smoke.sh
          ./scripts/package_release.sh "${{ inputs.app_version }}" "${{ inputs.build_number || '1' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRay-${{ inputs.app_version }}
          path: |
            dist/DRay-${{ inputs.app_version }}.zip
            dist/DRay-${{ inputs.app_version }}.dmg
            dist/DRay-${{ inputs.app_version }}-SHA256SUMS.txt
